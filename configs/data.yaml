# Split design (plan §4), focused on three stages:
#   directions -- estimate refusal (r) and harmfulness (d) directions
#   repair     -- choose / tune steering (layer, mixture beta, strength alpha)
#   test       -- held-out harmful compliance, over-refusal, benign utility
# All counts are proposed starting budgets. Other loaders in geosteer/data/sources.py
# (coconot_*, math500) are available but not used yet.
seed: 20261108
dedup_threshold: 0.8        # TF-IDF word 1-2gram cosine for near-duplicate group merging

sources:                    # name -> {max_records: deterministic hash subsample}
  jbb_harmful: {}           # topic-matched harmful/benign pairs
  jbb_benign: {}
  advbench: {}
  orbench_hard: {}          # alarming-but-benign
  orbench_toxic: {}
  alpaca: {max_records: 1000}
  sorry_bench: {}           # test only
  xstest: {}                # test only
  gsm8k: {}                 # test only
  alpaca_eval: {}           # test only

# Output folder per stage; only roles listed here are written to disk.
stages:
  directions: [direction]
  repair: [repair]
  test: [harm_test, overrefusal_test, utility_test]

# Whole sources reserved for final evaluation; any group touching them goes there too.
reserved:
  sorry_bench: harm_test
  xstest: overrefusal_test          # XSTest-safe is the target; unsafe contrasts kept as harmful controls
  alpaca_eval: utility_test
  gsm8k: utility_test

# Allocated in this order (test first, so held-out sets are protected).
# quota: stratum -> count (null = allowed, uncapped, rides along with capped strata).
roles:
  harm_test:                        # Sorry-Bench (reserved) + unseen AdvBench behaviours
    sources: [advbench]
    quota: {harmful: 150}
  overrefusal_test:                 # XSTest (reserved) + held-out OR-Bench-Hard
    sources: [orbench_hard]
    quota: {alarming_benign: 300}
  direction:                        # r / d estimation (~200 per stratum)
    sources: [jbb_harmful, jbb_benign, advbench, orbench_hard, orbench_toxic, alpaca]
    prefer_sources: [jbb_harmful, jbb_benign]   # topic-matched pairs first
    quota: {harmful: 200, alarming_benign: 200, benign: 200}
  repair:                           # steering selection / tuning (nested subsets below)
    sources: [advbench, orbench_hard, orbench_toxic, alpaca]
    quota: {harmful: 100, alarming_benign: 100, benign: 100}

nested_subsets:
  repair:
    strata: [harmful, alarming_benign, benign]
    sizes: [24, 48, 96, 192]

# Default data budgets (number of prompts, balanced across strata; null = whole role).
# Override per run, e.g. `compute_geometry.py --budget 100`. Selection is nested: budget 50 is a subset of 100.
budgets:
  direction: null
  repair: null

# Fixed stratum allocation for budgets, in stratum order harmful:alarming_benign:benign.
# null = balanced. Declare before analysis and keep it identical across models and budgets:
# the mix changes what r and d measure, so angles from different allocations are not comparable.
budget_weights:
  direction: null           # e.g. "1:2:1" puts half the budget on alarming-but-benign prompts
# Repair is scored on harmful compliance, over-refusal and utility together, so it stays balanced (plan §4).
balanced_only_roles: [repair]
